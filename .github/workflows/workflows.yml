name: CI Pipeline
on:
  push:
    branches:
      - "#"

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: checkout@v4

      - name: Set up Java
        uses: actions/set-upjava@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Install dependencies & run tests
        run: mvn clean test

      - name: Upload test results (optional)
        uses: actions/upload-artifact@v4
        if: always()
        with:
            name: test-results
            path: target/surefire-reports
